name: SwipeKeys
options:
  bundleIdPrefix: com.angieng.swipekeys
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM is intentionally not set here — it's account-specific
    # and shouldn't be committed. Because `xcodegen generate` fully
    # regenerates the .xcodeproj from this file every time, any team you
    # select in Xcode's Signing & Capabilities pane does NOT survive a
    # re-generate. Re-select it on both the SwipeKeys and SwipeKeysKeyboard
    # targets after every `xcodegen generate` — this is required, not
    # optional, and is the most common cause of "no signing certificate"
    # or distribution/archive failures.

targets:
  SwipeKeys:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "SwipeKeys.entitlements"
      - path: Shared
      - path: AppResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angieng.swipekeys
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/SwipeKeys.entitlements
    dependencies:
      - target: SwipeKeysKeyboard
        embed: true

  SwipeKeysKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - "Info.plist"
          - "SwipeKeysKeyboard.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angieng.swipekeys.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/SwipeKeysKeyboard.entitlements

schemes:
  SwipeKeys:
    build:
      targets:
        SwipeKeys: all
        SwipeKeysKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
